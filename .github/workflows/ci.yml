name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      # We don't have explicit tests written yet, but we can verify that the backend syntax is valid
      - name: Validate Backend (Syntax Check)
        working-directory: ./server
        run: node -e "require('./src/index.js')" & sleep 5 && kill $!
