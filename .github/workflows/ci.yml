name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Validate Backend Syntax
        working-directory: ./server
        run: node -e "
          try {
            require('./src/config/db');
            require('./src/middleware/authMiddleware');
            require('./src/middleware/errorMiddleware');
            require('./src/models/User');
            require('./src/models/Project');
            require('./src/models/Task');
            require('./src/models/Activity');
            require('./src/models/Notification');
            require('./src/models/Invitation');
            require('./src/models/Message');
            require('./src/models/Note');
            require('./src/models/Resource');
            require('./src/models/Session');
            require('./src/socket');
            console.log('All backend modules loaded successfully');
          } catch (e) {
            console.error('Backend validation failed:', e.message);
            process.exit(1);
          }
        "
