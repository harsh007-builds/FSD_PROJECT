server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets with unique hashes
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Docker embedded DNS resolver for dynamic runtime resolution
    # Using a variable in proxy_pass defers resolution to request time,
    # preventing Nginx startup crashes when the backend container is starting up or restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse proxy API requests to backend service
    location /api {
        set $backend_upstream "http://backend:5000";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy Socket.IO requests to backend service with WebSocket upgrade
    location /socket.io {
        set $backend_upstream "http://backend:5000";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA fallback routing: all client routes fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for Nginx container
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        default_type text/html;
        return 502 '<!DOCTYPE html><html><head><title>Service Unavailable</title></head><body style="font-family:sans-serif;text-align:center;padding:50px;background:#0f172a;color:#f8fafc;"><h2>StudySync Backend is Starting Up</h2><p>The backend service is initializing. Please wait a few moments and refresh.</p></body></html>\n';
    }
}
