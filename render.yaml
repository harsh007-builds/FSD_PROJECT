services:
  - type: web
    name: studysync-backend
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CRON_SECRET
        sync: false

  # Optional Render Cron Job to wake backend and trigger deadline checks
  # (Recommended for Render free tier to prevent sleep-induced missed alerts)
  - type: cron
    name: studysync-deadline-cron
    env: node
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: "curl -X POST -H \"x-cron-secret: $CRON_SECRET\" https://studysync-backend.onrender.com/api/notifications/process-deadlines"
    envVars:
      - key: CRON_SECRET
        sync: false
